[package]
name = "court-monitor-nas"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "court-monitor-nas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
hex = "0.4"
hmac = "0.12"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }
pbkdf2 = "0.12"
pem = "3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "cookies"] }
ring = "0.17"
roxmltree = "0.21"
rusqlite = { version = "0.43", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
