[package]
name = "court-monitor-nas"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "court-monitor-nas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
