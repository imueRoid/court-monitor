name: Test and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-server.lock.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-server.lock.txt httpx
      - name: Check server and common client
        run: |
          python -m unittest discover -s tests -p 'test_server*.py' -v
          python -m unittest discover -s tests -p 'test_client.py' -v
          python -m unittest discover -s tests -p 'test_summary.py' -v
          python -m unittest discover -s tests -p 'test_ocr.py' -v
      - uses: docker/setup-buildx-action@v4
      - name: Build image for runtime check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: court-monitor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container login, SQLite restart and OCR runtime
        run: python tests/container_smoke.py
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: imueroid
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            imueroid/court-monitor:latest
            imueroid/court-monitor:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Court Monitor
            org.opencontainers.image.source=https://github.com/imueRoid/court-monitor
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
