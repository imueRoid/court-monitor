name: Test and publish NAS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-server.lock.txt
      - name: Build release identity
        id: meta
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          import re
          from server.build_info import VERSION_SERIES
          assert re.fullmatch(r"[0-9]+\.[0-9]+", VERSION_SERIES)
          version = f"{VERSION_SERIES}.{int(os.environ['GITHUB_RUN_NUMBER'])}"
          created = datetime.now(timezone.utc).isoformat(timespec="seconds")
          from scripts.package_update import runtime_id
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in {"version": version, "series": VERSION_SERIES,
                                 "major": VERSION_SERIES.split(".")[0], "created": created,
                                 "runtime": runtime_id()}.items():
                  output.write(f"{key}={value}\n")
          print("Release version: " + version)
          PY
      - name: Check whether the Docker runtime has changed
        id: runtime
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          APP_RUNTIME: ${{ steps.meta.outputs.runtime }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen

          url = 'https://github.com/imueRoid/court-monitor/releases/latest/download/court-monitor-update.json'
          try:
              with urlopen(url, timeout=25) as response:
                  published = json.load(response)['runtime']
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('publish_image=' + str(published != os.environ['APP_RUNTIME']).lower(), file=output)
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-server.lock.txt httpx
      - name: Check server and common client
        run: |
          python -m unittest discover -s tests -p 'test_server*.py' -v
          python -m unittest discover -s tests -p 'test_client.py' -v
          python -m unittest discover -s tests -p 'test_summary.py' -v
          python -m unittest discover -s tests -p 'test_ocr.py' -v
      - name: Test native NAS server
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 test --locked --manifest-path nas/Cargo.toml
      - uses: docker/setup-buildx-action@v4
      - name: Build image for runtime check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            APP_RUNTIME=${{ steps.meta.outputs.runtime }}
          tags: court-monitor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container login, version, SQLite restart and OCR runtime
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: python tests/container_smoke.py
      - name: Check app update and rollback with an existing database
        run: |
          container=$(docker create court-monitor:test)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/court-monitor-nas" /tmp/court-monitor-nas
          COURT_MONITOR_NAS_BINARY=/tmp/court-monitor-nas \
            python -m unittest discover -s tests -p 'test_nas_runtime.py' -v
      - name: Log in to Docker Hub
        if: steps.runtime.outputs.publish_image == 'true'
        uses: docker/login-action@v4
        with:
          username: imueroid
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested image
        if: steps.runtime.outputs.publish_image == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=registry,oci-mediatypes=false
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            APP_RUNTIME=${{ steps.meta.outputs.runtime }}
          tags: |
            imueroid/court-monitor:latest
            imueroid/court-monitor:${{ steps.meta.outputs.major }}
            imueroid/court-monitor:${{ steps.meta.outputs.series }}
            imueroid/court-monitor:${{ steps.meta.outputs.version }}
            imueroid/court-monitor:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published format and version aliases
        if: steps.runtime.outputs.publish_image == 'true'
        run: python tests/verify_published_image.py "${{ steps.meta.outputs.version }}" "${{ github.sha }}"
      - name: Package the NAS application
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DATE: ${{ steps.meta.outputs.created }}
        run: |
          python scripts/package_update.py --output release --binary /tmp/court-monitor-nas \
            --version "$APP_VERSION" --revision "$GITHUB_SHA" --created "$BUILD_DATE"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: nas-app-release
          path: release/
          if-no-files-found: error

  release:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nas-app-release
      - name: Publish verified app update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er .version court-monitor-update.json)
          gh release create "app-v$version" court-monitor-update.json court-monitor-app-linux-amd64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Court Monitor NAS $version" --generate-notes
