<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>처음 설정 · 사건정보연동</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/auth.css"><script src="/static/setup.js" defer></script></head><body class="login-page"><main class="login-shell"><div class="login-brand"><span class="eyebrow">COURT MONITOR</span><h1>처음 설정</h1><p>이 NAS에서 사용할 관리자 비밀번호를 정하세요.</p></div><section class="card"><form id="setup-form" class="login-form"><label for="password">새 관리자 비밀번호</label><input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="256" autofocus><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="256"><button id="setup-button" type="submit">비밀번호 설정하고 시작</button></form><p id="setup-message" class="error" role="status"></p><p class="hint">8~256자를 입력하세요. 비밀번호는 이 NAS의 DB에 해시로 저장합니다. Compose 파일은 수정할 필요가 없습니다.</p></section><p><a href="/about">앱 소개</a> · <a href="/privacy">개인정보처리방침</a></p></main></body></html>
