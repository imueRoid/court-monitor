# Synology Container Manager: 프로젝트에 이 내용만 넣어 실행합니다.
# 최초 실행 전에 ADMIN_PASSWORD를 본인의 비밀번호(16~256자)로 채우세요.
version: "3.8"
services:
  court:
    image: imueroid/court-monitor:latest
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "7708:8080"
    environment:
      TZ: Asia/Seoul
      DATABASE_PATH: /data/cases.sqlite3
      ADMIN_PASSWORD: ""  # 최초 실행 시에만 DB에 관리자 비밀번호를 등록합니다.
      SESSION_DAYS: "90"
      COOKIE_SECURE: "false"  # HTTPS로만 접속할 때는 true로 설정합니다.
      GOOGLE_CALENDAR_ID: ""  # 사건 관리 전용 캘린더 ID
      GOOGLE_CREDENTIALS_JSON: |
        {}
      BASE_POLL_HOURS: "24"
      HEARING_DELAY_MINUTES: "30"
      VERDICT_RETRY_MINUTES: "30"
      VERDICT_CHECKS_PER_DAY: "8"
      WATCH_START_HOUR: "9"
      WATCH_END_HOUR: "19"
      REQUEST_GAP_SECONDS: "5"
    volumes:
      - court_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  court_data:
