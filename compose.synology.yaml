# Synology Container Manager: 프로젝트에 이 내용만 넣어 실행합니다.
# 수정 없이 실행한 뒤 http://NAS-IP:7708 에서 비밀번호와 Google 연결을 설정합니다.
version: "3.8"
services:
  court:
    image: imueroid/court-monitor:latest
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    init: true
    network_mode: host
    command: ["python", "-m", "uvicorn", "server.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "7708", "--workers", "1", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7708/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      TZ: Asia/Seoul
      DATABASE_PATH: /data/cases.sqlite3
      SESSION_DAYS: "90"
      BASE_POLL_HOURS: "24"
      HEARING_DELAY_MINUTES: "30"
      VERDICT_RETRY_MINUTES: "30"
      VERDICT_CHECKS_PER_DAY: "8"
      WATCH_START_HOUR: "9"
      WATCH_END_HOUR: "19"
      REQUEST_GAP_SECONDS: "5"
    volumes:
      - court_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  court_data:
